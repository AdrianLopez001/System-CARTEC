spring.application.name=cartec-sistema

# Fase local (ver plano-sistema-java secao 11): H2 em arquivo, persiste em ./data/cartec.*
# AUTO_SERVER=TRUE foi removido: quebra dentro de container Docker porque o H2
# tenta resolver o hostname do proprio container (UnknownHostException) - e nao
# e necessario aqui, ja que o console H2 (quando ligado via profile "local")
# roda na mesma JVM/mesma conexao do app, nao um processo separado.
spring.datasource.url=jdbc:h2:file:./data/cartec
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 fica DESLIGADO por padrao (fica exposto sem senha, so
# usuario "sa"/vazio - risco real fora do computador local). Para ligar
# durante desenvolvimento, rode com SPRING_PROFILES_ACTIVE=local (ver
# application-local.properties) - nunca ativar isso na Hostinger.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Login unico (ver SecurityConfig) - admin/admin e so pra teste inicial.
# ANTES de subir na Hostinger, definir as variaveis de ambiente
# APP_SECURITY_ADMIN_USERNAME e APP_SECURITY_ADMIN_PASSWORD com uma senha de
# verdade.
app.security.admin-username=admin
app.security.admin-password=admin

# Token do bot do WhatsApp (whatsapp-bot/index.js) - OBRIGATORIO (ver
# WhatsappController.validarToken, agora fail-closed). Precisa ser IGUAL ao
# CARTEC_SISTEMA_TOKEN configurado no bot. Trocar via variavel de ambiente
# WHATSAPP_BOT_TOKEN antes de subir na Hostinger.
whatsapp.bot.token=troque-este-token-local
whatsapp.bot.url=http://localhost:3001

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.port=8080

# Sem isso, ResponseStatusException(reason) vira so "No message available" no
# JSON de erro pro front - as mensagens de validacao (ex: disparo, importacao)
# ficam mudas. Ferramenta interna com login, sem risco de vazar stack trace
# sensivel pro publico.
server.error.include-message=always

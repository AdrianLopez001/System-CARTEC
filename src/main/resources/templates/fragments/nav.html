<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar" class="topbar">
    <div class="marca">
        <span class="marca-caixa">CS</span>
        <span class="marca-texto">CARTEC <b>Service</b></span>
    </div>
    <nav id="navPrincipal">
        <a href="/">Dashboard</a>
        <a href="/calendario">Calendário</a>
        <a href="/ordens-servico">Faturamento</a>
        <a href="/financeiro">Financeiro</a>
        <a href="/clientes">Clientes & Empresas</a>
        <a href="/reengajamento">Reengajamento</a>
        <a href="/tarefas">Tarefas</a>
        <a href="/whatsapp">WhatsApp</a>
        <a href="/campanhas">CRM e Campanhas</a>
        <a href="/relatorios">Relatórios</a>
        <a href="/configuracoes">Configurações</a>
    </nav>
</header>
<script th:fragment="script-nav-ativo">
    (function () {
        var caminho = window.location.pathname;
        document.querySelectorAll('#navPrincipal a').forEach(function (link) {
            var href = link.getAttribute('href');
            var ativo = href === '/' ? caminho === '/' : caminho.indexOf(href) === 0;
            if (ativo) link.classList.add('ativo');
        });
    })();
</script>
</body>
</html>

<script th:fragment="script-nav-ativo">
    (function () {
        var caminho = window.location.pathname;
        document.querySelectorAll('#navPrincipal a').forEach(function (link) {
            var href = link.getAttribute('href');
            var ativo = href === '/' ? caminho === '/' : caminho.indexOf(href) === 0;
            if (ativo) link.classList.add('ativo');
        });
    })();
</script>

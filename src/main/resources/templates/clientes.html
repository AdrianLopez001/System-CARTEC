<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cartec — Clientes</title>
    <style th:replace="~{fragments/estilos :: base}"></style>
</head>
<body>
<header th:replace="~{fragments/nav :: topbar}"></header>
<div class="page-header">
    <div>
        <h1>Clientes</h1>
        <p th:text="${clientes.size()} + ' cadastrados'">0 cadastrados</p>
    </div>
    <a class="botao" href="/reengajamento">Reengajamento →</a>
</div>
<main>
    <section class="card">
        <div class="tabela-scroll">
            <table th:unless="${clientes.isEmpty()}">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Tag</th>
                    <th>Empresa</th>
                    <th>Segmento</th>
                    <th>Última visita</th>
                    <th>Total gasto</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clientes}" th:with="m=${metricas.get(c.id)}">
                    <td><a th:href="@{'/clientes/' + ${c.id}}" th:text="${c.nome}">Nome</a></td>
                    <td th:text="${c.telefone}">-</td>
                    <td th:text="${c.tag}">-</td>
                    <td th:text="${c.empresa != null ? c.empresa.nome : '-'}">-</td>
                    <td>
                        <span th:if="${m != null}" class="badge"
                              th:classappend="'seg-' + ${#strings.toLowerCase(#strings.replace(m.segmento.name(),'_','-'))}"
                              th:text="${m.segmento.rotulo}">Segmento</span>
                        <span th:if="${m == null}" class="badge seg-sem-historico">Sem histórico</span>
                    </td>
                    <td th:text="${m != null and m.ultimaVisita != null ? #temporals.format(m.ultimaVisita, 'dd/MM/yyyy') : '-'}">-</td>
                    <td class="numero" th:text="${m != null ? 'R$ ' + #numbers.formatDecimal(m.valorTotalGasto, 1, 'POINT', 2, 'COMMA') : '-'}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="vazio" th:if="${clientes.isEmpty()}">Nenhum cliente cadastrado ainda. Importe pela tela de <a href="/campanhas">CRM e Campanhas</a>.</p>
    </section>
</main>
<script th:replace="~{fragments/nav :: script-nav-ativo}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cartec — Negociações</title>
    <style th:replace="~{fragments/estilos :: base}"></style>
    <style>
        .quadro { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; }
        .coluna { background: var(--surface-1); border: 1px solid var(--grid); border-radius: 4px; padding: 12px; min-width: 200px; }
        .coluna h3 { font-size: 0.78rem; margin: 0 0 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.02em; font-weight: 600; }
        .deal { background: var(--page); border: 1px solid var(--grid); border-left: 3px solid var(--brand); border-radius: 4px; padding: 10px; margin-bottom: 8px; font-size: 0.85rem; }
        .deal .valor { font-weight: 700; margin-top: 4px; }
        .deal select { margin-top: 8px; font-size: 0.78rem; padding: 4px 6px; margin-bottom: 0; }
    </style>
</head>
<body>
<header th:replace="~{fragments/nav :: topbar}"></header>
<div class="page-header">
    <div>
        <h1>Negociações</h1>
        <p th:text="${negociacoes.size()} + ' no funil'">0 no funil</p>
    </div>
</div>
<main>
    <section class="card">
        <h2>Nova negociação</h2>
        <form id="formNegociacao">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required placeholder="Ex: Revisão frota - VM Locadora">
            <label for="clienteId">Cliente</label>
            <select id="clienteId">
                <option value="">— nenhum —</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
            </select>
            <label for="empresaId">Empresa</label>
            <select id="empresaId">
                <option value="">— nenhuma —</option>
                <option th:each="e : ${empresas}" th:value="${e.id}" th:text="${e.nome}"></option>
            </select>
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" min="0">
            <label for="dataPrevisao">Previsão de fechamento</label>
            <input type="date" id="dataPrevisao">
            <button type="submit">Criar</button>
        </form>
        <div id="resultado" class="resultado"></div>
    </section>

    <section class="card">
        <h2>Funil</h2>
        <div class="quadro">
            <div class="coluna" th:each="estagio : ${estagios}">
                <h3 th:text="${estagio.rotulo}">Estágio</h3>
                <div class="deal" th:each="n : ${negociacoes}" th:if="${n.estagio == estagio}">
                    <div th:text="${n.titulo}">Título</div>
                    <div th:if="${n.cliente != null}" class="descricao" th:text="${n.cliente.nome}"></div>
                    <div class="valor" th:if="${n.valor != null}" th:text="'R$ ' + ${#numbers.formatDecimal(n.valor, 1, 'POINT', 2, 'COMMA')}"></div>
                    <select th:attr="data-id=${n.id}" onchange="mudarEstagio(this)">
                        <option th:each="opcao : ${estagios}" th:value="${opcao}" th:text="${opcao.rotulo}"
                                th:selected="${opcao == n.estagio}"></option>
                    </select>
                </div>
            </div>
        </div>
    </section>
</main>

<script th:replace="~{fragments/nav :: script-nav-ativo}"></script>
<script>
    document.getElementById('formNegociacao').addEventListener('submit', async (evento) => {
        evento.preventDefault();
        const clienteId = document.getElementById('clienteId').value;
        const empresaId = document.getElementById('empresaId').value;
        const valor = document.getElementById('valor').value;
        const dataPrevisao = document.getElementById('dataPrevisao').value;
        const corpo = {
            titulo: document.getElementById('titulo').value,
            cliente: clienteId ? { id: Number(clienteId) } : null,
            empresa: empresaId ? { id: Number(empresaId) } : null,
            valor: valor ? Number(valor) : null,
            dataPrevisao: dataPrevisao || null
        };
        const resposta = await fetch('/api/negociacoes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(corpo)
        });
        const caixa = document.getElementById('resultado');
        if (resposta.ok) {
            caixa.className = 'resultado ok';
            caixa.textContent = 'Negociação criada. Recarregando...';
            setTimeout(() => window.location.reload(), 800);
        } else {
            caixa.className = 'resultado erro';
            caixa.textContent = 'Erro ao salvar (HTTP ' + resposta.status + ')';
        }
    });

    async function mudarEstagio(select) {
        const id = select.getAttribute('data-id');
        await fetch('/api/negociacoes/' + id + '/estagio', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ estagio: select.value })
        });
        window.location.reload();
    }
</script>
</body>
</html>

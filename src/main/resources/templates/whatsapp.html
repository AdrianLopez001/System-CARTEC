<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cartec — Chat WhatsApp</title>
    <style th:replace="~{fragments/estilos :: base}"></style>
    <style>
        /* Reduz o espaco ocupado acima do quadro do chat (cabecalho da
           pagina + card de conexao), pra sobrar o maximo de altura pra
           lista de conversas/mensagens - essa pagina e o chat, o resto e
           so contexto. */
        .page-header { padding-top: 14px; padding-bottom: 2px; }
        .page-header p { display: none; }
        main { gap: 10px; }
        .card-conexao { padding: 10px 16px; }

        /* Painel de conexao compacto */
        .conexao-compacta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .status-badge { font-weight: 700; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; }
        .status-CONECTADO { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
        .status-AGUARDANDO_QR { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
        .status-DESCONECTADO { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
        .qr-box { background: #ffffff; padding: 16px; border-radius: 8px; text-align: center; border: 1px solid var(--grid); margin-top: 12px; }
        .qr-box img { width: 220px; height: 220px; display: block; margin: 0 auto 10px auto; }

        /* Layout split-view do chat, estilo WhatsApp: coluna de contatos +
           thread com cabecalho/mensagens/composer fixos. Toda a cadeia
           flex/grid precisa de min-height:0, senao o item cresce pro
           tamanho do conteudo (thread longa) e empurra o composer pra
           fora da area visivel em vez de deixar so as mensagens rolarem. */
        /* Altura calculada via JS (ajustarAlturaShell) em vez de
           calc(100vh - Npx) fixo: a altura acima do chat varia (quebra de
           linha do header, etc.) e um numero fixo sempre erra pra algum
           lado - ou sobra espaco ou o composer fica fora da tela e a
           pagina toda precisa rolar, que e o que nao queremos aqui (o
           composer tem que ficar sempre visivel, como no WhatsApp). O
           valor abaixo e so um fallback pro primeiro paint antes do JS
           calcular. */
        main { padding-bottom: 16px; }
        .whatsapp-shell {
            display: grid;
            grid-template-columns: 340px 1fr;
            border: 1px solid var(--grid);
            border-radius: 10px;
            overflow: hidden;
            height: 70vh;
            min-height: 420px;
            background: var(--surface-1);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
        }
        @media (max-width: 850px) { .whatsapp-shell { grid-template-columns: 1fr; } }

        /* Coluna de contatos */
        .lista-contatos { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--grid); background: var(--surface-1); }
        .busca-contatos { padding: 10px 12px; border-bottom: 1px solid var(--grid); flex-shrink: 0; }
        .busca-contatos input { margin: 0; width: 100%; border-radius: 20px; background: var(--page); font-size: 0.85rem; padding: 8px 14px; }
        .lista-contatos-itens { flex: 1; min-height: 0; overflow-y: auto; }

        .contato-item { padding: 10px 14px; border-bottom: 1px solid var(--grid); border-left: 3px solid transparent; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; transition: background .12s, border-color .12s; }
        .contato-item:hover { background: var(--page); }
        .contato-item.ativo { background: color-mix(in srgb, var(--brand) 8%, var(--surface-1)); border-left-color: var(--brand); }
        .avatar { flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; background: var(--topbar); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.02em; }
        .contato-corpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .contato-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
        .contato-nome { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .contato-hora { font-size: 0.7rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
        .contato-preview { font-size: 0.8rem; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .contato-badges { display: flex; gap: 4px; flex-wrap: wrap; }
        .ponto-nao-lida { background: var(--brand); color: #fff; border-radius: 20px; font-size: 0.66rem; font-weight: 700; padding: 1px 7px; }

        /* Coluna da thread */
        .thread-coluna { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--page); }
        /* #threadConteudo (o <div> que o JS reaproveita pra "Selecione uma
           conversa" e depois pro cabecalho/mensagens/composer) fica ENTRE
           .thread-coluna e essas 3 pecas - sem virar flex container ele
           so empilha em bloco normal, e o flex:1 do .thread-mensagens abaixo
           nao tem efeito nenhum (flex so vale pra filho DIRETO de um flex
           container). Foi essa a causa real do composer sumindo. */
        #threadConteudo { display: flex; flex-direction: column; height: 100%; min-height: 0; }
        .thread-cabecalho { padding: 10px 18px; border-bottom: 1px solid var(--grid); background: var(--surface-1); flex-shrink: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .thread-cabecalho .info-contato { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
        .thread-cabecalho .avatar { width: 36px; height: 36px; font-size: 0.74rem; }
        .thread-cabecalho .textos { min-width: 0; }
        .nome-linha { display: flex; align-items: center; gap: 4px; min-width: 0; }
        .thread-cabecalho .nome { font-weight: 700; font-size: 0.94rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .thread-cabecalho .telefone { font-size: 0.75rem; color: var(--muted); }
        .nome-linha .botao-icone { width: 24px; height: 24px; font-size: 0.78rem; flex-shrink: 0; opacity: 0.55; }
        .nome-linha .botao-icone:hover { opacity: 1; }
        .nome-vinculado { font-size: 0.8rem; opacity: 0.6; flex-shrink: 0; cursor: help; }
        .input-nome-contato { margin: 0; padding: 3px 8px; font-size: 0.88rem; font-weight: 700; border-radius: 6px; width: 180px; }
        .classificacao-controles { display: flex; flex-wrap: wrap; gap: 6px; flex: 2 1 340px; }
        .classificacao-controles select, .classificacao-controles input { margin: 0; padding: 5px 10px; font-size: 0.74rem; border-radius: 14px; width: auto; min-width: 108px; }

        .thread-mensagens { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
        /* Horario com float (nao absolute): assim ele conta pro calculo de
           largura do balao e o texto flui ao redor dele - em "absolute" o
           balao nao sabia que precisava ser mais largo pra caber os dois,
           e em mensagens curtas ("oi", "b") o horario ficava por cima do
           texto. overflow:hidden no .bolha contem o float (senao ele
           escapa da caixa e o fundo do balao nao acompanha). */
        /* flex-shrink:0 e essencial: sem isso, o navegador comprime a
           altura de cada bolha (item flex dentro de .thread-mensagens)
           pra caber tudo sem rolar, em vez de deixar o container rolar -
           e como a bolha tem overflow:hidden (pro float do horario), o
           texto comprimido ficava cortado/invisivel. Com flex-shrink:0
           cada bolha mantem a altura natural e quem rola e a lista, igual
           no WhatsApp de verdade. */
        .bolha { max-width: 68%; padding: 7px 12px; border-radius: 12px; font-size: 0.87rem; line-height: 1.42; word-wrap: break-word; overflow: hidden; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05); flex-shrink: 0; }
        .bolha .hora { float: right; margin: 4px 0 -2px 10px; font-size: 0.64rem; opacity: 0.65; white-space: nowrap; }
        .bolha-entrada { align-self: flex-start; background: var(--surface-1); border: 1px solid var(--grid); border-bottom-left-radius: 3px; }
        .bolha-saida { align-self: flex-end; background: color-mix(in srgb, var(--brand) 15%, var(--surface-1)); border-bottom-right-radius: 3px; }

        .thread-vazia { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 0.9rem; text-align: center; padding: 20px; }

        .thread-form { display: flex; gap: 6px; align-items: flex-end; padding: 10px 14px; border-top: 1px solid var(--grid); background: var(--surface-1); flex-shrink: 0; }
        .composer-acoes { display: flex; gap: 2px; flex-shrink: 0; padding-bottom: 2px; }
        .botao-icone { background: transparent; border: none; color: var(--text-secondary); font-size: 1.25rem; line-height: 1; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .12s; }
        .botao-icone:hover { background: var(--page); }
        .composer-campo { position: relative; flex: 1; min-width: 0; display: flex; }
        .composer-campo textarea { flex: 1; min-height: 42px; max-height: 120px; margin: 0; resize: none; border-radius: 20px; padding: 10px 16px; }
        .thread-form button.botao-enviar { align-self: flex-end; flex-shrink: 0; border-radius: 50%; width: 42px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center; }
        .thread-form button.botao-enviar svg { width: 18px; height: 18px; }

        .popup-composer { position: absolute; bottom: calc(100% + 8px); left: 0; background: var(--surface-1); border: 1px solid var(--grid); border-radius: 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14); padding: 10px; z-index: 30; }
        .popup-emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; width: 260px; }
        .emoji-item { background: none; border: none; font-size: 1.15rem; padding: 4px; border-radius: 6px; cursor: pointer; line-height: 1; }
        .emoji-item:hover { background: var(--page); }
        .popup-modelos-lista { display: flex; flex-direction: column; gap: 2px; width: 280px; max-height: 220px; overflow-y: auto; }
        .modelo-item { background: none; border: none; text-align: left; font-size: 0.82rem; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--text-primary); line-height: 1.35; }
        .modelo-item:hover { background: var(--page); }
    </style>
</head>
<body>
<header th:replace="~{fragments/nav :: topbar}"></header>
<div class="page-header">
    <div>
        <h1>Chat WhatsApp</h1>
        <p>Conversas em tempo real, resposta direta pelo ERP e classificação manual</p>
    </div>
</div>
<main>
    <!-- PAINEL DE CONEXÃO COMPACTO -->
    <section class="card card-conexao">
        <div class="conexao-compacta">
            <span id="badgeStatus" class="status-badge status-DESCONECTADO">
                <span id="pontoStatus" style="width:8px; height:8px; border-radius:50%; background:currentColor;"></span>
                <span id="textoStatus">Verificando conexão...</span>
            </span>
            <span id="infoConexao" class="descricao" style="margin:0;">Verificando o bot...</span>
            <button type="button" class="secundario" onclick="toggleQr()" id="btnMostrarQr" style="display:none;">Ver QR Code</button>
            <button type="button" class="secundario" onclick="desconectarBot()" id="btnDesconectar" style="display:none;">Desconectar</button>
        </div>
        <div id="containerQr" class="qr-box" style="display:none;">
            <img id="imgQrCode" src="" alt="QR Code WhatsApp">
            <span style="font-size:0.8rem; color:#475569; display:block;">Escaneie com a câmera do seu WhatsApp (Aparelhos Conectados)</span>
        </div>
    </section>

    <!-- CHAT SPLIT-VIEW -->
    <div class="whatsapp-shell">
        <aside class="lista-contatos">
            <div class="busca-contatos">
                <input type="text" id="buscaContato" placeholder="Pesquisar conversa..." oninput="renderizarListaContatos()">
            </div>
            <div class="lista-contatos-itens" id="listaContatos">
                <p class="vazio" style="padding:16px;">Carregando conversas...</p>
            </div>
        </aside>

        <section class="thread-coluna">
            <div id="threadConteudo" class="thread-vazia">Selecione uma conversa à esquerda para ver as mensagens.</div>
        </section>
    </div>
</main>

<script th:replace="~{fragments/nav :: script-nav-ativo}"></script>
<script th:replace="~{fragments/scripts :: escape-html}"></script>
<script>
    const OPCOES_INTENCAO = ['agendamento', 'orcamento', 'status_os', 'reclamacao', 'pecas', 'elogio', 'informacao', 'outro'];
    const OPCOES_URGENCIA = ['urgente', 'normal', 'baixa'];
    const OPCOES_CONSULTOR = ['Rosemberg', 'Luiz', 'Adrian', 'qualquer'];

    let conversas = [];
    let telefoneAtivo = null;

    // ───────────── Conexão do bot ─────────────
    async function verificarStatus() {
        try {
            const res = await fetch('/api/whatsapp/status');
            const data = await res.json();

            const badge = document.getElementById('badgeStatus');
            const texto = document.getElementById('textoStatus');
            const info = document.getElementById('infoConexao');
            const btnQr = document.getElementById('btnMostrarQr');
            const btnDesconectar = document.getElementById('btnDesconectar');
            const containerQr = document.getElementById('containerQr');
            const imgQr = document.getElementById('imgQrCode');

            badge.className = 'status-badge status-' + data.status;

            if (data.status === 'CONECTADO') {
                texto.textContent = 'CONECTADO (' + (data.phone || 'WhatsApp Oficial') + ')';
                info.textContent = 'Conta ativa, pronta para enviar e receber mensagens.';
                btnQr.style.display = 'none';
                containerQr.style.display = 'none';
                btnDesconectar.style.display = 'inline-block';
            } else if (data.status === 'AGUARDANDO_QR') {
                texto.textContent = 'AGUARDANDO LEITURA DO QR CODE';
                info.textContent = 'Abra o WhatsApp no celular > Aparelhos Conectados.';
                btnDesconectar.style.display = 'none';
                if (data.qrCodeUrl) {
                    imgQr.src = data.qrCodeUrl;
                    btnQr.style.display = 'inline-block';
                }
            } else {
                texto.textContent = 'DESCONECTADO';
                info.textContent = 'Inicie o whatsapp-bot (node index.js) para conectar.';
                btnQr.style.display = 'none';
                containerQr.style.display = 'none';
                btnDesconectar.style.display = 'none';
            }
        } catch (err) {
            console.error('Erro ao verificar status do bot WhatsApp:', err);
        }
    }

    function toggleQr() {
        const containerQr = document.getElementById('containerQr');
        containerQr.style.display = containerQr.style.display === 'none' ? 'block' : 'none';
    }

    async function desconectarBot() {
        if (!confirm('Deseja realmente desconectar a conta do WhatsApp?')) return;
        try {
            await fetch('/api/whatsapp/desconectar', { method: 'POST' });
            alert('Solicitação de desconexão enviada.');
            verificarStatus();
        } catch (err) {
            alert('Erro ao desconectar: ' + err.message);
        }
    }

    // ───────────── Lista de conversas ─────────────
    async function carregarConversas() {
        const res = await fetch('/api/whatsapp/conversas');
        conversas = await res.json();
        renderizarListaContatos();
    }

    function nomeConversa(c) {
        if (c.cliente && c.cliente.nome) return c.cliente.nome;
        if (c.nomeContatoWhatsapp) return c.nomeContatoWhatsapp;
        return c.telefone;
    }

    function iniciais(nome) {
        const partes = (nome || '').trim().split(/\s+/).filter(Boolean);
        if (partes.length === 0) return '?';
        if (partes.length === 1) return partes[0].substring(0, 2).toUpperCase();
        return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
    }

    function renderizarListaContatos() {
        const container = document.getElementById('listaContatos');
        const termo = (document.getElementById('buscaContato')?.value || '').trim().toLowerCase();
        const filtradas = termo
            ? conversas.filter(c => nomeConversa(c).toLowerCase().includes(termo) || c.telefone.includes(termo))
            : conversas;

        if (conversas.length === 0) {
            container.innerHTML = '<p class="vazio" style="padding:16px;">Nenhuma conversa ainda.</p>';
            return;
        }
        if (filtradas.length === 0) {
            container.innerHTML = '<p class="vazio" style="padding:16px;">Nenhuma conversa encontrada.</p>';
            return;
        }
        container.innerHTML = '';
        filtradas.forEach(c => {
            const item = document.createElement('div');
            item.className = 'contato-item' + (c.telefone === telefoneAtivo ? ' ativo' : '');
            item.onclick = () => selecionarConversa(c.telefone);

            const hora = c.dataUltimaMensagem ? new Date(c.dataUltimaMensagem).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
            const nome = nomeConversa(c);

            item.innerHTML = `
                <span class="avatar">${escapeHtml(iniciais(nome))}</span>
                <div class="contato-corpo">
                    <div class="contato-topo">
                        <span class="contato-nome">${escapeHtml(nome)}</span>
                        <span class="contato-hora">${hora}</span>
                    </div>
                    <div class="contato-preview">${escapeHtml(c.resumo || c.telefone)}</div>
                    <div class="contato-badges">
                        ${!c.lida ? '<span class="ponto-nao-lida">NOVA</span>' : ''}
                        ${c.intencao ? `<span class="badge">${escapeHtml(c.intencao)}</span>` : ''}
                        ${c.urgencia === 'urgente' ? '<span class="badge seg-inativo">urgente</span>' : ''}
                    </div>
                </div>
            `;
            container.appendChild(item);
        });
    }

    // ───────────── Thread ativa ─────────────
    async function selecionarConversa(telefone) {
        telefoneAtivo = telefone;
        renderizarListaContatos();

        const conversa = conversas.find(c => c.telefone === telefone);
        const conteudo = document.getElementById('threadConteudo');
        conteudo.className = '';
        conteudo.innerHTML = montarEsqueletoThread(conversa);

        preencherControlesClassificacao(conversa);
        document.getElementById('formEnvio').addEventListener('submit', enviarMensagem);
        document.getElementById('formClassificacao').addEventListener('change', salvarClassificacao);

        const campoTexto = document.getElementById('textoEnvio');
        campoTexto.addEventListener('input', () => {
            campoTexto.style.height = 'auto';
            campoTexto.style.height = Math.min(campoTexto.scrollHeight, 120) + 'px';
        });
        campoTexto.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('formEnvio').requestSubmit();
            }
        });
        campoTexto.focus();
        configurarComposerExtras();
        configurarEdicaoNome(telefone);

        await carregarMensagens(telefone);

        if (conversa && !conversa.lida) {
            await fetch('/api/whatsapp/conversas/' + telefone + '/marcar-lida', { method: 'POST' });
            conversa.lida = true;
            renderizarListaContatos();
        }
    }

    function montarEsqueletoThread(conversa) {
        const nome = conversa ? nomeConversa(conversa) : telefoneAtivo;
        return `
            <div class="thread-cabecalho">
                <div class="info-contato">
                    <span class="avatar">${escapeHtml(iniciais(nome))}</span>
                    <div class="textos">
                        <div class="nome-linha">
                            <span class="nome" id="nomeContatoTexto">${escapeHtml(nome)}</span>
                            ${(conversa && conversa.cliente)
                                ? '<span class="nome-vinculado" title="Nome vem do cadastro de cliente - edite em Clientes & Empresas">🔗</span>'
                                : '<button type="button" class="botao-icone botao-editar-nome" id="btnEditarNome" title="Editar nome do contato">✏️</button>'}
                        </div>
                        <div class="telefone">${escapeHtml(telefoneAtivo)}</div>
                    </div>
                </div>
                <form id="formClassificacao" class="classificacao-controles">
                    ${selectHtml('intencao', OPCOES_INTENCAO, conversa ? conversa.intencao : null)}
                    ${selectHtml('urgencia', OPCOES_URGENCIA, conversa ? conversa.urgencia : null)}
                    ${selectHtml('consultorSugerido', OPCOES_CONSULTOR, conversa ? conversa.consultorSugerido : null)}
                    <input type="text" name="resumo" placeholder="Resumo da conversa" value="${escapeAttr(conversa ? conversa.resumo : '')}">
                </form>
            </div>
            <div class="thread-mensagens" id="threadMensagens"></div>
            <form id="formEnvio" class="thread-form">
                <div class="composer-acoes">
                    <button type="button" class="botao-icone" id="btnEmoji" title="Emoji">🙂</button>
                    <button type="button" class="botao-icone" id="btnModelos" title="Respostas rápidas">⚡</button>
                </div>
                <div class="composer-campo">
                    <textarea id="textoEnvio" placeholder="Digite uma mensagem..." rows="1" required></textarea>
                    <div class="popup-composer" id="popupEmoji" hidden>
                        <div class="popup-emoji-grid"></div>
                    </div>
                    <div class="popup-composer" id="popupModelos" hidden>
                        <div class="popup-modelos-lista"></div>
                    </div>
                </div>
                <button type="submit" class="botao-enviar" title="Enviar">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 20L21 12L3 4V10L16 12L3 14V20Z" fill="currentColor"/></svg>
                </button>
            </form>
        `;
    }

    const EMOJIS = ['😀','😃','😄','😁','😊','🙂','😉','😍','😘','🤔','😅','😢','😭','😡','😴','🤝','👍','👎','🙏','👏','💪','🔥','✅','❌','⏰','📅','🚗','🔧','💰','📦','🎉','❤️'];
    const MODELOS_RESPOSTA = [
        'Olá! Como posso te ajudar hoje?',
        'Seu veículo está pronto para retirada.',
        'Estamos aguardando a chegada da peça, assim que chegar te aviso.',
        'Pode me confirmar a placa do veículo?',
        'Vou verificar e já te retorno.',
        'Obrigado pelo contato! Qualquer coisa estou à disposição.'
    ];

    function configurarComposerExtras() {
        const btnEmoji = document.getElementById('btnEmoji');
        const btnModelos = document.getElementById('btnModelos');
        const popupEmoji = document.getElementById('popupEmoji');
        const popupModelos = document.getElementById('popupModelos');
        const campoTexto = document.getElementById('textoEnvio');

        const gridEmoji = popupEmoji.querySelector('.popup-emoji-grid');
        gridEmoji.innerHTML = EMOJIS.map(e => `<button type="button" class="emoji-item">${e}</button>`).join('');
        gridEmoji.querySelectorAll('.emoji-item').forEach(btn => {
            btn.addEventListener('click', () => {
                inserirNoCampo(campoTexto, btn.textContent);
                fecharPopups();
            });
        });

        const listaModelos = popupModelos.querySelector('.popup-modelos-lista');
        listaModelos.innerHTML = MODELOS_RESPOSTA.map((m, i) => `<button type="button" class="modelo-item" data-i="${i}">${escapeHtml(m)}</button>`).join('');
        listaModelos.querySelectorAll('.modelo-item').forEach(btn => {
            btn.addEventListener('click', () => {
                campoTexto.value = MODELOS_RESPOSTA[Number(btn.dataset.i)];
                campoTexto.dispatchEvent(new Event('input'));
                campoTexto.focus();
                fecharPopups();
            });
        });

        function fecharPopups() {
            popupEmoji.hidden = true;
            popupModelos.hidden = true;
        }
        btnEmoji.addEventListener('click', (e) => {
            e.stopPropagation();
            const abrindo = popupEmoji.hidden;
            fecharPopups();
            popupEmoji.hidden = !abrindo;
        });
        btnModelos.addEventListener('click', (e) => {
            e.stopPropagation();
            const abrindo = popupModelos.hidden;
            fecharPopups();
            popupModelos.hidden = !abrindo;
        });
        document.addEventListener('click', fecharPopups);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharPopups(); });
    }

    function inserirNoCampo(campo, texto) {
        const inicio = campo.selectionStart ?? campo.value.length;
        const fim = campo.selectionEnd ?? campo.value.length;
        campo.value = campo.value.slice(0, inicio) + texto + campo.value.slice(fim);
        const novoCursor = inicio + texto.length;
        campo.setSelectionRange(novoCursor, novoCursor);
        campo.dispatchEvent(new Event('input'));
        campo.focus();
    }

    function configurarEdicaoNome(telefone) {
        const btn = document.getElementById('btnEditarNome');
        if (!btn) return; // conversa vinculada a cliente cadastrado - nao edita aqui
        btn.addEventListener('click', () => iniciarEdicaoNome(telefone));
    }

    function iniciarEdicaoNome(telefone) {
        const linha = document.querySelector('.nome-linha');
        const conversa = conversas.find(c => c.telefone === telefone);
        const nomeAtual = conversa ? nomeConversa(conversa) : telefone;

        linha.innerHTML = `
            <input type="text" id="inputNomeContato" class="input-nome-contato" value="${escapeAttr(nomeAtual)}" maxlength="120">
            <button type="button" class="botao-icone" id="btnSalvarNome" title="Salvar">✅</button>
            <button type="button" class="botao-icone" id="btnCancelarNome" title="Cancelar">✖️</button>
        `;
        const input = document.getElementById('inputNomeContato');
        input.focus();
        input.select();

        const salvar = () => salvarNomeContato(telefone, input.value);
        document.getElementById('btnSalvarNome').addEventListener('click', salvar);
        document.getElementById('btnCancelarNome').addEventListener('click', () => selecionarConversa(telefone));
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); salvar(); }
            if (e.key === 'Escape') { e.preventDefault(); selecionarConversa(telefone); }
        });
    }

    async function salvarNomeContato(telefone, novoNome) {
        const nome = novoNome.trim();
        if (!nome) return;
        const res = await fetch('/api/whatsapp/conversas/' + telefone + '/nome', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome })
        });
        if (res.ok) {
            const atualizada = await res.json();
            const idx = conversas.findIndex(c => c.telefone === telefone);
            if (idx >= 0) conversas[idx] = atualizada;
            renderizarListaContatos();
            selecionarConversa(telefone);
        } else {
            alert('Erro ao salvar o nome (HTTP ' + res.status + ')');
        }
    }

    function selectHtml(nome, opcoes, valorAtual) {
        const options = ['<option value="">' + rotulo(nome) + '</option>']
            .concat(opcoes.map(o => `<option value="${o}" ${o === valorAtual ? 'selected' : ''}>${o}</option>`));
        return `<select name="${nome}">${options.join('')}</select>`;
    }

    function rotulo(campo) {
        return { intencao: 'Intenção', urgencia: 'Urgência', consultorSugerido: 'Consultor' }[campo] || campo;
    }

    function preencherControlesClassificacao(conversa) {
        // Controles ja sao preenchidos no montarEsqueletoThread via selected/value
    }

    async function carregarMensagens(telefone) {
        const res = await fetch('/api/whatsapp/conversas/' + telefone + '/mensagens');
        const mensagens = await res.json();
        const container = document.getElementById('threadMensagens');
        if (!container) return;
        container.innerHTML = '';
        mensagens.forEach(m => container.appendChild(criarBolha(m)));
        container.scrollTop = container.scrollHeight;
    }

    function criarBolha(msg) {
        const div = document.createElement('div');
        div.className = 'bolha ' + (msg.direcao === 'ENTRADA' ? 'bolha-entrada' : 'bolha-saida');
        const hora = new Date(msg.dataHora).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        div.innerHTML = `${escapeHtml(msg.texto)}<span class="hora">${hora}</span>`;
        return div;
    }

    async function enviarMensagem(e) {
        e.preventDefault();
        const campo = document.getElementById('textoEnvio');
        const texto = campo.value.trim();
        if (!texto || !telefoneAtivo) return;

        campo.disabled = true;
        try {
            const res = await fetch('/api/whatsapp/enviar-mensagem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telefone: telefoneAtivo, texto })
            });
            if (res.ok) {
                campo.value = '';
                campo.style.height = 'auto';
            } else {
                const data = await res.json().catch(() => ({}));
                alert('Erro ao enviar: ' + (data.erro || 'verifique se o bot está CONECTADO.'));
            }
        } catch (err) {
            alert('Erro de rede: ' + err.message);
        } finally {
            campo.disabled = false;
            campo.focus();
        }
    }

    async function salvarClassificacao(e) {
        if (!telefoneAtivo) return;
        const form = document.getElementById('formClassificacao');
        const dados = {
            intencao: form.intencao.value || null,
            urgencia: form.urgencia.value || null,
            consultorSugerido: form.consultorSugerido.value || null,
            resumo: form.resumo.value || null
        };
        const res = await fetch('/api/whatsapp/conversas/' + telefoneAtivo + '/classificacao', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        });
        if (res.ok) {
            const atualizada = await res.json();
            const idx = conversas.findIndex(c => c.telefone === telefoneAtivo);
            if (idx >= 0) conversas[idx] = atualizada;
            renderizarListaContatos();
        }
    }

    // ───────────── SSE - mensagens em tempo real ─────────────
    function conectarSse() {
        const es = new EventSource('/api/whatsapp/stream');
        es.addEventListener('nova-mensagem', async (evt) => {
            const msg = JSON.parse(evt.data);
            await carregarConversas();
            if (msg.telefone === telefoneAtivo) {
                const container = document.getElementById('threadMensagens');
                if (container) {
                    container.appendChild(criarBolha(msg));
                    container.scrollTop = container.scrollHeight;
                }
                if (msg.direcao === 'ENTRADA') {
                    fetch('/api/whatsapp/conversas/' + telefoneAtivo + '/marcar-lida', { method: 'POST' });
                }
            }
        });
        es.onerror = () => { /* EventSource reconecta sozinho */ };
    }

    function escapeAttr(texto) {
        return escapeHtml(texto).replace(/"/g, '&quot;');
    }

    // ───────────── Altura do chat: preenche o espaco visivel restante,
    // sem deixar a pagina inteira rolar (o composer tem que ficar fixo) ─────
    function ajustarAlturaShell() {
        const shell = document.querySelector('.whatsapp-shell');
        if (!shell) return;
        const topo = shell.getBoundingClientRect().top;
        const alturaDisponivel = window.innerHeight - topo - 16;
        shell.style.height = Math.max(alturaDisponivel, 280) + 'px';
    }
    window.addEventListener('resize', ajustarAlturaShell);

    verificarStatus();
    setInterval(verificarStatus, 3000);
    carregarConversas();
    conectarSse();
    ajustarAlturaShell();
    setTimeout(ajustarAlturaShell, 300);
</script>

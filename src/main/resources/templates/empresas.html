<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cartec — Empresas</title>
    <style th:replace="~{fragments/estilos :: base}"></style>
</head>
<body>
<header th:replace="~{fragments/nav :: topbar}"></header>
<div class="page-header">
    <div>
        <h1>Empresas</h1>
        <p th:text="${empresas.size()} + ' cadastradas'">0 cadastradas</p>
    </div>
</div>
<main>
    <section class="card">
        <h2>Nova empresa</h2>
        <form id="formEmpresa">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>
            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj">
            <label for="segmento">Segmento</label>
            <input type="text" id="segmento" placeholder="Ex: Frotas, B2B">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone">
            <label for="email">Email</label>
            <input type="text" id="email">
            <button type="submit">Salvar</button>
        </form>
        <div id="resultado" class="resultado"></div>
    </section>

    <section class="card">
        <div class="tabela-scroll">
            <table th:unless="${empresas.isEmpty()}">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Segmento</th>
                    <th>Telefone</th>
                    <th>Contatos</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${empresas}">
                    <td th:text="${e.nome}">Nome</td>
                    <td th:text="${e.segmento}">-</td>
                    <td th:text="${e.telefone}">-</td>
                    <td th:text="${e.contatos.size()}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="vazio" th:if="${empresas.isEmpty()}">Nenhuma empresa cadastrada ainda.</p>
    </section>
</main>

<script th:replace="~{fragments/nav :: script-nav-ativo}"></script>
<script>
    document.getElementById('formEmpresa').addEventListener('submit', async (evento) => {
        evento.preventDefault();
        const corpo = {
            nome: document.getElementById('nome').value,
            cnpj: document.getElementById('cnpj').value,
            segmento: document.getElementById('segmento').value,
            telefone: document.getElementById('telefone').value,
            email: document.getElementById('email').value
        };
        const resposta = await fetch('/api/empresas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(corpo)
        });
        const caixa = document.getElementById('resultado');
        if (resposta.ok) {
            caixa.className = 'resultado ok';
            caixa.textContent = 'Empresa criada. Recarregando...';
            setTimeout(() => window.location.reload(), 800);
        } else {
            caixa.className = 'resultado erro';
            caixa.textContent = 'Erro ao salvar (HTTP ' + resposta.status + ')';
        }
    });
</script>
</body>
</html>
